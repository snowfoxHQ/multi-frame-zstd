name: Publish to npm

on:
  release:
    types: [published] # 或 push: tags: ['v*']

permissions:
  id-token: write # 必须
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # 必须是 GitHub 托管的 runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # 建议 Node 22+
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm publish --access public